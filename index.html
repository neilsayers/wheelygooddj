<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">

<meta property="og:type" content="website">
<meta property="og:title" content="Wheely Good DJ – Camelot Wheel Key Compatibility Tool">
<meta property="og:description" content="Free Camelot wheel tool for DJs. Pick your track's key and instantly see every key that mixes cleanly with it, from safe neighbours to advanced energy moves.">
<meta property="og:url" content="https://wheelygooddj.com/">
<meta property="og:image" content="https://wheelygooddj.com/icons/icon-512.png">

<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Wheely Good DJ – Camelot Wheel Key Compatibility Tool">
<meta name="twitter:description" content="Free Camelot wheel tool for DJs. Pick your track's key and instantly see every key that mixes cleanly with it.">

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wheely Good DJ">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebApplication",
  "name": "Wheely Good DJ",
  "url": "https://wheelygooddj.com/",
  "description": "Camelot wheel key-compatibility lookup for DJs. Pick a key and see every key that mixes cleanly with it.",
  "applicationCategory": "MusicApplication",
  "operatingSystem": "Any",
  "offers": { "@type": "Offer", "price": "0", "priceCurrency": "GBP" }
}
</script>
</head>
<body>
<div class="app">
  <header class="app-header">
    <div class="header-left">
      <h1>Wheely Good DJ</h1>
      <p class="strapline">Go on - choose your key. The crowd will think you're a genius. I won't tell anybody if you won't...</p>
    </div>
    <div class="toggle-column">
      <label class="toggle">
        <input type="checkbox" id="advanced-toggle">
        <span class="toggle-track"><span class="toggle-thumb"></span></span>
        <span class="toggle-label">Advanced moves</span>
      </label>
      <label class="toggle">
        <input type="checkbox" id="notes-toggle">
        <span class="toggle-track"><span class="toggle-thumb"></span></span>
        <span class="toggle-label">Notes emphasis</span>
      </label>
    </div>
  </header>

  <div class="stage">
    <div id="wheel-pane" class="wheel-pane">
      <div id="wheel" class="wheel"></div>
      <div class="wheel-controls">
        <button id="btn-up" class="wheel-arrow" aria-label="Previous key">&#9650;</button>
        <button id="btn-down" class="wheel-arrow" aria-label="Next key">&#9660;</button>
      </div>
    </div>

    <div id="results-pane" class="results-pane">
      <div id="results" class="results"></div>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
