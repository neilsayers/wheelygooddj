<body>
<div class="bg-blobs" aria-hidden="true">
  <div class="bg-blob bg-blob-1"></div>
  <div class="bg-blob bg-blob-2"></div>
  <div class="bg-blob bg-blob-3"></div>
  <div class="bg-blob bg-blob-4"></div>
</div>
<div class="app">
  <header class="app-header">
    <div class="header-left">
      <h1>Wheely Good DJ</h1>
      <p class="strapline">Go on - choose your key. The crowd will think you're a genius. I won't tell anybody if you won't...</p>
    </div>
  </header>

  <div class="stage">
    <div id="wheel-pane" class="wheel-pane">
      <div class="wheel-tracks" aria-hidden="true">
        <div class="track track-a"></div>
        <div class="track track-b"></div>
      </div>
      <div id="wheel" class="wheel"></div>
      <div class="wheel-controls">
        <button id="btn-up" class="wheel-arrow" aria-label="Previous key">&#9650;</button>
        <button id="btn-down" class="wheel-arrow" aria-label="Next key">&#9660;</button>
      </div>
    </div>

    <div id="results-pane" class="results-pane">
      <button id="settings-toggle" class="settings-toggle" type="button" aria-label="Open settings" aria-expanded="false" aria-controls="settings-drawer">
        <span aria-hidden="true">&#9881;</span>
      </button>
      <div id="settings-drawer" class="settings-drawer">
        <div class="settings-drawer-header">
          <span class="settings-drawer-title">Settings</span>
          <button id="settings-close" class="settings-close" type="button" aria-label="Close settings">&times;</button>
        </div>
        <div class="bpm-panel" id="bpm-panel">
          <div class="bpm-panel-title">Playing at a different tempo?</div>
          <div class="bpm-fields">
            <label class="bpm-field">
              <span class="bpm-field-label">Original BPM</span>
              <select id="bpm-original" class="bpm-select"></select>
            </label>
            <label class="bpm-field">
              <span class="bpm-field-label">Actual BPM</span>
              <select id="bpm-actual" class="bpm-select"></select>
            </label>
          </div>
          <p class="bpm-readout" id="bpm-readout" aria-live="polite"></p>
        </div>
        <label class="toggle toggle-notes">
          <input type="checkbox" id="notes-toggle">
          <span class="toggle-track"><span class="toggle-thumb"></span></span>
          <span class="toggle-label">Emphasise notes notation (e.g. Abm, not the Camelot number notation)</span>
        </label>
        <label class="toggle toggle-advanced" id="advanced-toggle-row">
          <input type="checkbox" id="advanced-toggle">
          <span class="toggle-track"><span class="toggle-thumb"></span></span>
          <span class="toggle-label">Show advanced transitions</span>
        </label>
      </div>
      <div id="results" class="results"></div>
      <button id="results-close" class="results-close" type="button" aria-label="Close transitions">&times;</button>
    </div>
  </div>

  <footer class="app-footer">
    <p>&copy; 2026 ScreenCandy &mdash; Site by <a href="https://screencandy.co.uk" target="_blank" rel="noopener">ScreenCandy</a></p>
  </footer>
</div>

<div id="consent-banner" class="consent-banner" role="dialog" aria-label="Cookie consent" hidden>
  <p>We use Google Analytics to see which keys get looked up — no ads, nothing sold on.</p>
  <div class="consent-actions">
    <button id="consent-reject" class="consent-btn consent-btn-ghost">No thanks</button>
    <button id="consent-accept" class="consent-btn consent-btn-primary">Accept</button>
  </div>
</div>
